[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dphil-analysis"
version = "0.1.0"
description = "Reproducible DPhil analysis methods"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2",
    "scipy",
    "zarr>=3",
    "msprime",
    "tskit",
    "polars>=1.44.2",
    "tscompare>=0.2.1",
    "tsinfer",
    "tsls",
    "tsdate>=0.2.7",
    "tszip>=0.3.1",
]

[dependency-groups]
dev = [
    "ipykernel",
    "jupyterlab",
    "jupytext",
    "matplotlib",
    "nbconvert",
    "nbformat",
    "pandas",
    "pytest>=9.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ch3", "src/ch4", "src/ch5"]

[tool.uv.sources]
tsinfer = { git = "https://github.com/Duncan-JR/tsinfer", rev = "e2f8de7c950179215ece27e1d31c7b096308b4c8" }
tsls = { git = "file:///Users/duncan/work/tsls", rev = "c560b405761ae09625e266d39c2356ccc4b54b69" }
