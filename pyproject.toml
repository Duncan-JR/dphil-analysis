[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dphil-analysis"
version = "0.1.0"
description = "Reproducible DPhil analysis methods"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2",
    "scipy",
    "zarr>=3",
    "msprime",
    "tskit",
    "polars>=1.44.2",
    "tscompare>=0.2.1",
    "tsinfer",
    "tsls",
    "tsdate>=0.2.7",
    "tszip>=0.3.1",
]

[dependency-groups]
dev = [
    "ipykernel",
    "jupyterlab",
    "jupytext",
    "matplotlib",
    "nbconvert",
    "nbformat",
    "pandas",
    "pytest>=9.1.1",
    "snakemake>=9,<10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ch3", "src/ch4", "src/ch5"]

# Replace the pinned tsinfer checkout's machine-specific tsls source with the
# identical retained release built from commit c560b405761ae09625e266d39c2356ccc4b54b69.
[tool.uv]
override-dependencies = ["tsls==0.1.dev121"]

[tool.uv.sources]
tsinfer = { git = "https://github.com/Duncan-JR/tsinfer", rev = "e2f8de7c950179215ece27e1d31c7b096308b4c8" }
tsls = { path = "data/general/dependencies/tsls-0.1.dev121.tar.gz" }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
