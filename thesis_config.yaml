thesis_root: ../dphil-thesis
work_root: data/ch3/thesis_prepared
statistics_dir: statistics

chapter3:
  analysis:
    versions: [0.4.1, 0.5.1]
    genotype_multipliers: [1, 2, 5, 10, 100]
    mispol_rates: [0, 0.01, 0.05, 0.1]
    phase_spacings: [0, 200000, 2000000, 20000000]
    tgp_region_start: 0
    tgp_region_end: 20000000
    tgp_count_prefix: variant_1kgp_all_subset
    overshoot_summary_threshold_bp: -10000000
  demographies: [AmericanAdmixture_4B18, Africa_1T12, Zigzag_1S14]
  empirical_performance_prefix: 1kgp-chr20-L0-R2.81e7
  claims:
    genotype_multipliers: [0, 1, 2, 5, 10]
    frequency_cutoffs: [0, 0.001, 0.003, 0.02, 0.5, 1]
    central_lower_quantile: 0.25
    maf_threshold: 0.001
    published_genotype_error_rate: 0.00032
    histogram_bins: 100
    moderate_phase_spacing: 2000000
    extreme_phase_spacing: 200000
    zigzag_model: Zigzag_1S14
    tail_probability: 0.001
    approximation_percent_step: 10
    baseline_genotype_multiplier: 1
    extreme_genotype_multiplier: 10
    combined_profiles: [none, all]
    comparison_haplotypes: 10000
  experiment:
    sequence_length_bp: 20000000
    diploid_individuals: 6000
    empirical_diploid_individuals: 3202

  # Output filenames, independent of the plotting defaults in thesis_plot.py.
  figures:
    ancestor_extension: ancestor_extension_comparison.png
    extension_tree: ancestor_extension_trees.pdf
    pipeline_illustration: anc_eval_pipe.png
    demography_overshoot_quantiles: demography_overshoot_box.png
    demography_overlap_errors: demography_overlap_errors.png
    ancestor_span_simulation: ancestor_span_frequency_simulation.png
    ancestor_span_tgp: ancestor_span_frequency_tgp.png
    ancestor_overshoot: ancestor_overshoot_boxplot.png
    ancestor_overlap_errors: ancestor_overlap_errors.png
    genotype_error_scaling: genotype_error_scaling.png
    genotype_overshoot_summary: genotype_error_overshoot_summary.png
    genotype_overshoot_diff: genotype_error_overshoot_diff.png
    mispolarisation_daf: mispolarisation_daf.png
    mispolarisation_overshoot_diff: mispolarisation_overshoot_correct_focal_diff.png
    mispolarised_focal_overshoot_hist: mispolarisation_overshoot_flipped_focal_hist.png
    mispolarisation_overlap_errors: mispolarisation_overlap_errors.png
    phase_switch_illustration: phase_switch_illustration.png
    phasing_overshoot_summary: phasing_error_overshoot_summary.png
    phasing_overshoot_diff: phasing_error_overshoot_diff.png
    combined_errors: combined_errors.png
    speedup: inference_performance_speedup.png
    elapsed: inference_performance_elapsed.png
    resources: inference_performance_parallelism.png

  # Only non-default arguments for renderers used by more than one figure.
  plot_kwargs:
    demography_overlap_errors:
      figsize: [8.5, 4.8]
      group_by: model
      show_counts: false
      panel_labels: [A, B]
      split_error_types: true
      ancestor_error_y_log: false
    ancestor_span_tgp:
      dataset: 1000 Genomes Project
      title: 1KGP chromosome 20p ({extent_mb:.1f}mbp)
    phasing_overshoot_summary:
      by: space_per_switch
